name: Publicar Atualização OTA FinancIA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Compilar APK Release Assinado com Keystore Unificada
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Preparar arquivo APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk FinancIA.apk

      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: FinancIA.apk
          tag_name: ${{ github.ref_name }}
          name: FinancIA ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
